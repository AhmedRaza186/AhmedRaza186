name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout github-profile-trophy source
        uses: actions/checkout@v4
        with:
          repository: ryo-ma/github-profile-trophy
          path: trophy-src

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Verify GitHub token
        env:
          TOKEN: ${{ secrets.TROPHY_TOKEN }}
        run: |
          echo "--- REST API check ---"
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" -H "Authorization: token $TOKEN" https://api.github.com/user
          echo "--- GraphQL API check (this is what render_svg.ts actually uses) ---"
          curl -s -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"query { viewer { login } }"}' \
            https://api.github.com/graphql

      - name: Generate trophy SVG
        working-directory: trophy-src
        env:
          GITHUB_TOKEN: ${{ secrets.TROPHY_TOKEN }}
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write ./render_svg.ts AhmedRaza186 ../ tokyonight

      - name: Commit trophy.svg
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "Update trophy.svg"
          git push