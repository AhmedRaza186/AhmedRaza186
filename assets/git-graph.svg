@keyframes c3{0%,23.33%{opacity:0}24.529999999999998%,96%{opacity:1}100%{opacity:0}}.c3{animation:c3 15s linear infinite}
@keyframes c4{0%,25.56%{opacity:0}26.759999999999998%,96%{opacity:1}100%{opacity:0}}.c4{animation:c4 15s linear infinite}
@keyframes c5{0%,32.22%{opacity:0}33.42%,96%{opacity:1}100%{opacity:0}}.c5{animation:c5 15s linear infinite}
@keyframes c6{0%,34.44%{opacity:0}35.64%,96%{opacity:1}100%{opacity:0}}.c6{animation:c6 15s linear infinite}
@keyframes c7{0%,39.44%{opacity:0}40.64%,96%{opacity:1}100%{opacity:0}}.c7{animation:c7 15s linear infinite}
@keyframes c8{0%,43.33%{opacity:0}44.53%,96%{opacity:1}100%{opacity:0}}.c8{animation:c8 15s linear infinite}
