<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="860" height="340" role="img" aria-label="Git graph of Ahmed's work from JS assignments in August 2025 to Perfume AI in October 2026, with AI and motion branches merging into his portfolio.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2027"/><stop offset="1" stop-color="#203a43"/></linearGradient>
<style>text{font-family:ui-monospace, 'Cascadia Code', SFMono-Regular, Menlo, Consolas, monospace}.n{fill:#e6edf3;font-size:15px;font-weight:600}.d{fill:#a3b8c4;font-size:12.5px}.b{font-size:13px}
@media (prefers-reduced-motion:no-preference){
@keyframes pmain{0%,3.33%{stroke-dashoffset:1;opacity:1}39.44%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}.pmain{stroke-dasharray:1;animation:pmain 15s linear infinite}
