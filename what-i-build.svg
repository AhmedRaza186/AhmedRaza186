<svg viewBox="0 0 920 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#203a43"/>
    </linearGradient>
    <style>
      .card {
        opacity: 0;
        animation: rise 0.6s ease-out forwards;
      }
      .card rect.bg {
        fill: #16232b;
        stroke: #2c3e46;
        stroke-width: 1;
      }
      .icon { font-size: 26px; }
      .title { fill: #e6edf3; font-size: 16px; font-weight: 600; }
      .subtitle { fill: #8b98a5; font-size: 12px; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .c0 { animation-delay: 0.05s; }
      .c1 { animation-delay: 0.15s; }
      .c2 { animation-delay: 0.25s; }
      .c3 { animation-delay: 0.35s; }
      .c4 { animation-delay: 0.45s; }
      .c5 { animation-delay: 0.55s; }
      .c6 { animation-delay: 0.65s; }
      .c7 { animation-delay: 0.75s; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="420" rx="18" fill="url(#bg)"/>

  <text x="460" y="45" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">What I Build</text>
  <text x="460" y="68" text-anchor="middle" fill="#7fd4e8" font-size="12">Full-stack systems, end to end</text>

  <!-- Row 1 -->
  <g transform="translate(30,95)">
    <g class="card c0">
      <rect class="bg" width="205" height="130" rx="14"/>
      <rect x="0" y="0" width="6" height="130" rx="3" fill="#0EA5E9"/>
      <text class="icon" x="24" y="46">🖥️</text>
      <text class="title" x="24" y="80">Full-Stack Apps</text>
      <text class="subtitle" x="24" y="102">End-to-end web platforms</text>
    </g>
  </g>

  <g transform="translate(255,95)">
    <g class="card c1">
      <rect class="bg" width="205" height="130" rx="14"/>
      <rect x="0" y="0" width="6" height="130" rx="3" fill="#61DAFB"/>
      <text class="icon" x="24" y="46">⚡</text>
      <text class="title" x="24" y="80">React &amp; Next.js</text>
      <text class="subtitle" x="24" y="102">Modern frontend experiences</text>
    </g>
  </g>

  <g transform="translate(480,95)">
    <g class="card c2">
      <rect class="bg" width="205" height="130" rx="14"/>
      <rect x="0" y="0" width="6" height="130" rx="3" fill="#A855F7"/>
      <text class="icon" x="24" y="46">🤖</text>
      <text class="title" x="24" y="80">AI Automation</text>
      <text class="subtitle" x="24" y="102">AI-powered features</text>
    </g>
  </g>

  <g transform="translate(705,95)">
    <g class="card c3">
      <rect class="bg" width="185" height="130" rx="14"/>
      <rect x="0" y="0" width="6" height="130" rx="3" fill="#22C55E"/>
      <text class="icon" x="24" y="46">🔌</text>
      <text class="title" x="24" y="80">REST APIs</text>
      <text class="subtitle" x="24" y="102">Backend services</text>
    </g>
  </g>

  <!-- Row 2 -->
  <g transform="translate(30,245)">
    <g class="card c4">
      <rect class="bg" width="205" height="130" rx="14"/>
      <rect x="0" y="0" width="6" height="130" rx="3" fill="#4169E1"/>
      <text class="icon" x="24" y="46">🗄️</text>
      <text class="title" x="24" y="80">Databases</text>
      <text class="subtitle" x="24" y="102">Data-driven applications</text>
    </g>
  </g>

  <g transform="translate(255,245)">
    <g class="card c5">
      <rect class="bg" width="205" height="130" rx="14"/>
      <rect x="0" y="0" width="6" height="130" rx="3" fill="#F97316"/>
      <text class="icon" x="24" y="46">🔐</text>
      <text class="title" x="24" y="80">Auth &amp; Roles</text>
      <text class="subtitle" x="24" y="102">Secure access systems</text>
    </g>
  </g>

  <g transform="translate(480,245)">
    <g class="card c6">
      <rect class="bg" width="205" height="130" rx="14"/>
      <rect x="0" y="0" width="6" height="130" rx="3" fill="#F59E0B"/>
      <text class="icon" x="24" y="46">📦</text>
      <text class="title" x="24" y="80">Business Tools</text>
      <text class="subtitle" x="24" y="102">Productivity software</text>
    </g>
  </g>

  <g transform="translate(705,245)">
    <g class="card c7">
      <rect class="bg" width="185" height="130" rx="14"/>
      <rect x="0" y="0" width="6" height="130" rx="3" fill="#38BDF8"/>
      <text class="icon" x="24" y="46">🧩</text>
      <text class="title" x="24" y="80">Dev Tooling</text>
      <text class="subtitle" x="24" y="102">Internal developer tools</text>
    </g>
  </g>
</svg>
